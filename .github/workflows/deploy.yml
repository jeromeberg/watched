name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
      DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
      DEPLOY_REF: refs/heads/main
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Trigger deploy webhook
        if: env.DEPLOY_WEBHOOK_URL != '' && env.WEBHOOK_SECRET != ''
        run: |
          set -euo pipefail
          PAYLOAD=$(printf '{"ref":"%s","sha":"%s"}' "$DEPLOY_REF" "$DEPLOY_SHA")
          SIG=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -r | cut -d' ' -f1)
          curl -sf --max-time 30 -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$SIG" \
            --data "$PAYLOAD"
